version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dwrms_prod}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dwrms}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwrms_prod} -d ${POSTGRES_DB:-dwrms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-dwrms}/dwrms-backend:${IMAGE_TAG:-latest}
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dwrms_storage_prod:/var/dwrms/storage
      - dwrms_logs_prod:/var/dwrms/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dwrms_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dwrms}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://dwrms.bikita.com,tauri://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-https://dwrms.bikita.com}
      - STORAGE_PATH=/var/dwrms/storage
      - LOG_DIR=/var/dwrms/logs
      - ENVIRONMENT=production
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-dwrms}/dwrms-backend:${IMAGE_TAG:-latest}
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dwrms_storage_prod:/var/dwrms/storage
      - dwrms_logs_prod:/var/dwrms/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dwrms_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dwrms}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - STORAGE_PATH=/var/dwrms/storage
      - LOG_DIR=/var/dwrms/logs
      - ENVIRONMENT=production
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-dwrms}/dwrms-backend:${IMAGE_TAG:-latest}
    restart: always
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dwrms_logs_prod:/var/dwrms/logs
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-dwrms_prod}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dwrms}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - dwrms_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKER_REGISTRY:-dwrms}/dwrms-frontend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://dwrms.bikita.com/api/v1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
      - dwrms_logs_prod:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - dwrms_prod

networks:
  dwrms_prod:
    driver: bridge

volumes:
  postgres_data_prod:
  redis_data_prod:
  dwrms_storage_prod:
  dwrms_logs_prod:
