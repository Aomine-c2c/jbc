# ==============================================================================
# BIKITA MINERALS DWRMS — AUTHORITATIVE OPENSSH HARDENING CONFIGURATION
# Location on Ubuntu Server: /etc/ssh/sshd_config.d/dwrms-security.conf
# Target OS: Ubuntu Server 22.04 LTS / 24.04 LTS
# ==============================================================================

# 1. Authentication Policies
# Disallow root login over SSH; server admins must use dedicated named accounts with sudo
PermitRootLogin no

# Enforce Public Key Authentication only; passwords disabled for SSH ingress
PubkeyAuthentication yes
PasswordAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Limit authentication retry attempts before connection drop
MaxAuthTries 3
MaxSessions 5

# 2. Key Algorithms & Cryptographic Hardening
# Enforce modern, secure elliptic-curve key exchange and host key algorithms
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_rsa_key
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# 3. Session & Security Restrictions
X11Forwarding no
AllowTcpForwarding yes
AllowAgentForwarding yes
GatewayPorts no
PermitTunnel no

# Idle connection timeouts (300 seconds = 5 minutes idle check, drop after 2 failed probes)
ClientAliveInterval 300
ClientAliveCountMax 2

# 4. Access Isolation & Allowed Groups
# Only users belonging to the 'sudo' or 'dwrms-admins' groups can open SSH sessions
AllowGroups sudo dwrms-admins

# 5. Logging & Audit
LogLevel VERBOSE
