name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clear Frozen Port Conflicts
        run: |
          sudo fuser -k 3000/tcp || true
          sudo fuser -k 8000/tcp || true

      - name: Rebuild and Restart Application Stacks
        run: |
          cd /opt/dwrms
          docker compose down
          docker compose up -d --build

      - name: Re-bind Tailscale Funnel to Port 3000
        run: |
          sudo tailscale funnel --bg http://127.0.0.1:3000
